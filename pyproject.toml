[build-system]
build-backend = "scikit_build_core.build"
requires = [
  "scikit-build-core>=0.9",
  "pybind11>=2.12",
  "setuptools",
  "setuptools_scm[toml]",
  "wheel",
]

[project]
name = "gropt"
version = "1.0.0"
authors = [{ name = "Michael Loecher" }]
maintainers = [
  { name = "Michael Loecher" },
]
description = "A toolbox for MRI gradient design"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = [
  "coverage>=6.2",
  "matplotlib>=3.5.2",
  "numpy>=1.19.5",
  "scipy>=1.8.1",
  "seaborn",
]

[project.optional-dependencies]
test = [
  "coverage",
  "codecov",
  "pre-commit",
  "pytest",
  "pytest-cov<6.1",
  "pytest-xdist",
  "hdf5storage",
]
docs = ["sphinx", "jinja2", "furo", "recommonmark"]

[project.urls]
Homepage = "https://github.com/mloecher/gropt"
Issues = "https://github.com/mloecher/gropt/issues"
Documentation = "https://gropt.readthedocs.io/en/latest/"

[tool.scikit-build]
# Ensure wheels get correct macOS tagging (optional)
wheel.expand-macos-universal-tags = true

[tool.setuptools.packages.find]
where=["python"]

[tool.setuptools.dynamic]
version = { attr = "version.__version__" }

[tool.ruff]
line-length = 120
extend-exclude = ["__init__.py"]
exclude = ["doc/**"]

# RUFF section
[tool.ruff.lint]
select = [
  "A",   # flake8-builtins
  "ARG", # flake8-unused-arguments
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "COM", # flake8-commas
  # "D",   # pydocstyle
  # "E",   # pycodestyle errors
  "F", # Pyflakes
  # "FA", # flake8-future-annotations
  "I", # isort
  # "N",   # pep8-naming
  "NPY", # NumPy-specific rules
  "RUF", # Ruff-specific rules
  "S",   # flake8-bandit
  "SIM", # flake8-simplify
  # "UP",  # pyupgrade
  "PIE", # flake8-pie
  "PTH", # flake8-use-pathlib
  "Q",   # flake8-quotes
  "W",   # pycodestyle warnings
  "YTT", # flake8-2020
  # "ERA", # flake8-eradicate
]

extend-select = [
  # "ANN001", #  type annotation for function argument
  # # "ANN201", #  return type annotation public function
  # # "ANN205", #  return type annotation static method
  # # "ANN401", #  any type annotation
  # # "BLE001", #  blind exception
  # # "D107",   #  missing docstring in __init__
  # # "D417",   #  undocumented-parameter
]

ignore = [
  "B028",   #  explicit "stacklevel" arg in warnings
  "COM812", #  missing-trailing-comma (conflict with formatter)
  "PTH123", #  use of Path.open
  "S101",   #  use of assert
  "S307",   #  use of possibly insecure eval function
  "S311",   #  standard pseudo-random generators
  "S324",   #  insecure hash function
  "SIM108", #  if-else-block-instead-of-if-exp
  "SIM115", #  use of context manager
]

[tool.ruff.lint.isort]
force-single-line = false
split-on-trailing-comma = false

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
quote-style = "single"
skip-magic-trailing-comma = false

[tool.typos.default]
locale = "en-us"

# PyTest section
[tool.pytest.ini_options]
minversion = "6.0"
pythonpath  = ["tests"]
testpaths = ["tests"]
addopts = [
    "--import-mode=importlib",
    "--cov=gropt",
    "--cov-report=term-missing",
    "--cov-report=xml"
]
filterwarnings = [
  "error",
  # Suppress error in debugpy due to mpl deprecation to debug tests.
  "ignore::matplotlib._api.deprecation.MatplotlibDeprecationWarning:pydev",
]

[tool.codespell]
# Ref: https://github.com/codespell-project/codespell#using-a-config-file
skip = '.git*'
check-hidden = true
ignore-words-list = 'te,fo,nd,maked,datas,iten,itel,tread'